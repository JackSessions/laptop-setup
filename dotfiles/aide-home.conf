# Home-folder-only integrity monitoring (the full-system default config is in aide.conf.orig).
# System-level changes are covered by auditd, debsums, rkhunter and the SIEM.
database_in=file:/var/lib/aide/aide.db
database_out=file:/var/lib/aide/aide.db.new
database_new=file:/var/lib/aide/aide.db.new
gzip_dbout=yes
log_level=warning
report_level=changed_attributes
report_url=stdout

# permissions, inode, links, owner, group, size, mtime, ctime, sha256
HOME_RULE = p+i+n+u+g+s+m+c+sha256

/home/void HOME_RULE

# Big, generated or constantly-changing: not worth watching
